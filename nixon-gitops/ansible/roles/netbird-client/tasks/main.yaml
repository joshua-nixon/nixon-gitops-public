- name: Check NetBird is installed
  ansible.builtin.command: netbird version
  register: netbird_version_output
  changed_when: false
  failed_when: false

- name: Install NetBird package
  when: netbird_version_output.rc != 0
  block:
    - name: Download NetBird repository public key
      ansible.builtin.get_url:
        url: https://pkgs.netbird.io/debian/public.key
        dest: /tmp/netbird-public.key
        mode: "0644"

    - name: Install gnupg
      ansible.builtin.package:
        name: gnupg
        state: present

    - name: Install NetBird repository keyring
      ansible.builtin.command:
        argv:
          - gpg
          - --dearmor
          - --yes
          - --output
          - /usr/share/keyrings/netbird-archive-keyring.gpg
          - /tmp/netbird-public.key
      args:
        creates: /usr/share/keyrings/netbird-archive-keyring.gpg

    - name: Configure NetBird repository
      ansible.builtin.deb822_repository:
        name: netbird
        types: deb
        uris: https://pkgs.netbird.io/debian
        suites: stable
        components: main
        signed_by: /usr/share/keyrings/netbird-archive-keyring.gpg
        state: present

    - name: Refresh package cache
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 60

    - name: Install NetBird
      ansible.builtin.package:
        name: netbird
        state: present

- name: Check NetBird connection status
  ansible.builtin.command:
    argv:
      - netbird
      - status
      - --json
  register: netbird_status_command
  changed_when: false
  failed_when: false

- name: Parse NetBird connection status
  ansible.builtin.set_fact:
    netbird_status: "{{ netbird_status_command.stdout | from_json }}"
  when:
    - netbird_status_command.rc == 0
    - netbird_status_command.stdout | trim | length > 0
  no_log: true

- name: Connect machine to NetBird
  ansible.builtin.command:
    argv:
      - netbird
      - up
      - --setup-key
      - "{{ netbird_setup_key }}"
      - --allow-server-ssh
      - --enable-ssh-root
  when:
    - netbird_setup_key is defined
    - netbird_setup_key | trim | length > 0
    - netbird_status_command.rc != 0 
      or (netbird_status | default({})).get('daemonStatus', '') != 'Connected'
  changed_when: true
  no_log: true