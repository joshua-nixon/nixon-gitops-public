name: HedgehogsCorner

on:
  repository_dispatch:
    types:
      - hedgehogscorner.website

permissions:
  contents: write

jobs:
  patch-image:
    uses: ./.github/workflows/Template.UpdateImage.yaml
    with:
      project: hedgehogscorner
      environment: ${{ github.event.client_payload.environment }}
      action: ${{ github.event.action }}
      image: ${{ github.event.client_payload.image }}
