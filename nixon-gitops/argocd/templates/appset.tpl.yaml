apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: $(APPSET_NAME)
  namespace: argocd
  labels:
    custom.kubernetes.io/is-adhoc: "true"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/joshua-nixon/nixon-gitops.git
              revision: main
              files:
                - path: "$(ARGO_FILE_PATH)"
          - list:
              elementsYaml: "{{ .applications | toJson }}"
  template:
    metadata:
      name: "$(NAME_TEMPLATE)"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: "$(MANIFEST_GENERATE_PATHS)"
    spec:
      project: default
      source:
        repoURL: https://github.com/joshua-nixon/nixon-gitops.git
        targetRevision: main
        path: "{{ .chart }}"
        helm:
          releaseName: "$(NAME_TEMPLATE)"
          ignoreMissingValueFiles: true
          valueFiles: $(VALUE_FILES)
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            custom.kubernetes.io/add-image-pull-secret: "true"
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - Prune=true
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
