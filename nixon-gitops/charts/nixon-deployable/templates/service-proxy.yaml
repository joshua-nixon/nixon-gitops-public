{{- if .Values.interceptorRoute.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nixon-deployable.proxyServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "nixon-deployable.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.interceptorRoute.interceptorAddress }}
  ports:
    - name: http
      port: {{ .Values.service.ports.http.port }}
      protocol: TCP
      targetPort: proxy
{{- end }}