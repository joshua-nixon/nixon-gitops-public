{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nixon-deployable.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "nixon-deployable.labels" . | nindent 4 }}
spec:
  type: "ClusterIP"
  selector:
{{- include "nixon-deployable.selectorLabels" . | nindent 4 }}
  ports:
{{- range $name, $port := .Values.service.ports }}
{{- if $port.enabled }}
    - name: {{ $name }}
      port: {{ $port.port }}
      targetPort: {{ $port.targetPort }}
      protocol: {{ $port.protocol }}
{{- end }}
{{- end }}
{{- end }}
