{{- $externalSecretKeys := list -}}
{{- range .Values.extraEnvValues -}}
  {{- if .externalSecretKeyRef -}}
    {{- $externalSecretKeys = append $externalSecretKeys . -}}
  {{- end -}}
{{- end -}}

{{- if $externalSecretKeys -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "nixon-deployable.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "nixon-deployable.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: ClusterSecretStore
  target:
    name: {{ include "nixon-deployable.name" . }}
    creationPolicy: Owner
  data:
{{- range $externalSecretKeys }}
    - secretKey: {{ .externalSecretKeyRef.key }}
      remoteRef:
        key: {{ .externalSecretKeyRef.key }}
{{- end }}
{{- end }}