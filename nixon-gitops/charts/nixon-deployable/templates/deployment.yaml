apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nixon-deployable.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "nixon-deployable.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: 10
  selector:
    matchLabels:
{{- include "nixon-deployable.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{- include "nixon-deployable.selectorLabels" . | nindent 8 }}
    spec:
{{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
{{- end }}
{{- if .Values.extraVolumes }}
      volumes:
{{- tpl (toYaml .Values.extraVolumes) . | nindent 8 }}
{{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
{{- include "nixon-deployable.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname

      containers:
        - name: {{ include "nixon-deployable.name" . }}
          image: {{ .Values.image | quote }}

{{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            timeoutSeconds: 3
{{- end }}

{{- if .Values.resources }}     
          resources:   
{{- toYaml .Values.resources | nindent 12 }}
{{- end }}

{{- if .Values.containerPorts }}
          ports:
{{- range $name, $port := .Values.containerPorts }}
{{- if $port.enabled }}
            - name: {{ $name }}
              containerPort: {{ $port.containerPort }}
{{- end }}
{{- end }}
{{- end }}
          env:
            - name: DOTNET_hostBuilder:reloadConfigOnChange
              value: 'false'
{{- if .Values.dotNetEnvironment }}
            - name: DOTNET_ENVIRONMENT
              value: {{ .Values.dotNetEnvironment | quote }}
{{- end }}
{{- $asp := include "nixon-deployable.aspnetCoreUrlsEnvValue" . }}
{{- if $asp }}
            - name: ASPNETCORE_URLS
              value: {{ $asp | quote }}
{{- end }}
{{- if .Values.containerPorts.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.containerPorts.metrics.containerPort | quote }}
{{- end }}
{{- range .Values.extraEnvValues }}
{{- if .externalSecretKeyRef }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "nixon-deployable.name" $ }}
                  key: {{ .externalSecretKeyRef.key }}
{{- else }}
{{ toYaml (list .) | nindent 12 }}
{{- end }}
{{- end }}

{{- if .Values.extraVolumeMounts }}
          volumeMounts:
{{- tpl (toYaml .Values.extraVolumeMounts) . | nindent 12 }}
{{- end }}
