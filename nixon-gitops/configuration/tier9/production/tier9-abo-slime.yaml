nameOverride: tier9-abo-slime

image: "sharedpersonalcontaineregistry.azurecr.io/abo.slime:master-20260820-175621-b5ce595b"

dotNetEnvironment: Production

resources:
  requests:
    memory: 280Mi
    cpu: 50m
  limits:
    memory: 350Mi
    cpu: 500m

extraEnvValues:
  - name: BOT_TOKEN
    externalSecretKeyRef:
      key: ABO-SLIME-TOKEN

  - name: PG_PASSWORD
    externalSecretKeyRef:
      key: ABO-PG-USER-WEB

  - name: OPENAI_KEY
    externalSecretKeyRef:
      key: ABO-OPENAI-KEY

  - name: T9_GOOGLE_SERVICE_ACCOUNT
    externalSecretKeyRef:
      key: ABO-GOOGLESERVICEACCOUNT
