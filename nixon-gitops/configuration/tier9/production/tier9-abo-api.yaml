nameOverride: tier9-abo-api

image: "containerregistry.azurecr.io/abo.api:master-20260820-175617-b5ce595b"

dotNetEnvironment: Production

resources:
  requests:
    memory: 40Mi
    cpu: 50m
  limits:
    memory: 140Mi
    cpu: 500m

containerPorts:
  http:
    enabled: true

service:
  enabled: true
  ports:
    http:
      enabled: true

extraEnvValues:
  - name: PG_PASSWORD
    externalSecretKeyRef:
      key: ABO-PG-USER-WEB

ingress:
  enabled: true
  rules:
    - host: api.autobattles.online
      paths:
        - path: /
          pathType: Prefix
