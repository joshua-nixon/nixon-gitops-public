nameOverride: tier9-abo-worldchat

image: "sharedpersonalcontaineregistry.azurecr.io/abo.worldchat:master-20260820-175620-b5ce595b"

dotNetEnvironment: Production

resources:
  requests:
    memory: 140Mi
    cpu: 50m
  limits:
    memory: 200Mi
    cpu: 500m

extraEnvValues:
  - name: BOT_TOKEN
    externalSecretKeyRef:
      key: ABO-WORLDCHAT-TOKEN

  - name: PG_PASSWORD
    externalSecretKeyRef:
      key: ABO-PG-USER-WEB

  - name: OPENAI_KEY
    externalSecretKeyRef:
      key: ABO-OPENAI-KEY

  - name: T9_GOOGLE_SERVICE_ACCOUNT
    externalSecretKeyRef:
      key: ABO-GOOGLESERVICEACCOUNT
