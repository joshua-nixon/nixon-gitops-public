nameOverride: tier9-abo-slime

dotNetEnvironment: Production

image: "sharedpersonalcontaineregistry.azurecr.io/abo.slime:master-20260809-175850-415ba32e"

resources:
  requests:
    memory: 250Mi
    cpu: 50m
  limits:
    memory: 290Mi
    cpu: 500m

extraEnvValues:
  - name: BOT_TOKEN
    externalSecretKeyRef:
      key: ABO-SLIME-TOKEN

  - name: PG_PASSWORD
    externalSecretKeyRef:
      key: ABO-PG-USER-WEB

  - name: OPENAI_KEY
    externalSecretKeyRef:
      key: ABO-OPENAI-KEY

  - name: T9_GOOGLE_SERVICE_ACCOUNT
    externalSecretKeyRef:
      key: ABO-GOOGLESERVICEACCOUNT
