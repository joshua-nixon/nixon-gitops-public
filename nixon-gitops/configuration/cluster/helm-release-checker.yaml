nameOverride: "helm-release-checker"

image: "containerregistry.azurecr.io/helm-release-checker:sha-2a1692fe0579"

schedule: "0 12 * * *"

suspend: true

extraEnvValues:
  - name: ALERTMANAGER_HOST
    value: http://alertmanager-operated.monitoring.svc.cluster.local:9093

rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["secrets", "configmaps"]
      verbs: ["get", "list"]
