nameOverride: untitledproject-api-auth

image: "sharedpersonalcontaineregistry.azurecr.io/untitledproject.api.auth:develop-20260906-152309-ff8705b-00929"

dotNetEnvironment: DevTest

containerPorts:
  http:
    enabled: true
  metrics:
    enabled: true

service:
  enabled: true
  ports:
    http:
      enabled: true
    metrics:
      enabled: true

readinessProbe:
  enabled: true

serviceMonitor:
  enabled: true

resources:
  requests:
    memory: 140Mi
    cpu: 50m
  limits:
    memory: 180Mi
    cpu: 500m

ingress:
  enabled: true
  rules:
    - host: up-api.joshuanixon.dev
      paths:
        - path: /connect
          pathType: Prefix
        - path: /.well-known
          pathType: Prefix
        - path: /oauth2
          pathType: Prefix
