nameOverride: untitledproject-api-monolith

image: "containerregistry.azurecr.io/untitledproject.api.monolith:develop-20260906-152309-ff8705b-03302"

dotNetEnvironment: DevTest

containerPorts:
  http:
    enabled: true
  metrics:
    enabled: true

service:
  enabled: true
  ports:
    http:
      enabled: true
    metrics:
      enabled: true

readinessProbe:
  enabled: true

serviceMonitor:
  enabled: true

resources:
  requests:
    memory: 120Mi
    cpu: 50m
  limits:
    memory: 140Mi
    cpu: 500m

ingress:
  enabled: true
  rules:
    - host: up-api.joshuanixon.dev
      paths:
        - path: /
          pathType: Prefix
