nameOverride: untitledproject-api-auth

image: "sharedpersonalcontaineregistry.azurecr.io/untitledproject.api.auth:develop-20260819-192452-9748b1a-03663"

dotNetEnvironment: DevTest

resources:
  requests:
    memory: 140Mi
    cpu: 50m
  limits:
    memory: 180Mi
    cpu: 500m

ingress:
  enabled: true
  rules:
    - host: up-api.joshuanixon.dev
      paths:
        - path: /connect
          pathType: Prefix
        - path: /.well-known
          pathType: Prefix
        - path: /oauth2
          pathType: Prefix

hpa:
  enabled: true
