nameOverride: greedymercs-api-monolith

image: "containerregistry.azurecr.io/greedymercs.api.monolith:master-20260801-221848-8be64351"

dotNetEnvironment: Production

securityContextPreset: "unset"

resources:
  requests:
    memory: 270Mi
    cpu: 50m
  limits:
    memory: 330Mi
    cpu: 500m

containerPorts:
  http:
    enabled: true

readinessProbe:
  enabled: true

service:
  enabled: true
  ports:
    http:
      enabled: true

extraEnvValues:
  - name: PG_PASSWORD
    externalSecretKeyRef:
      key: GM-PG-USER-WEB

  - name: Auth__DiscordClientSecret
    externalSecretKeyRef:
      key: GM-DISCORD-CLIENT-SECRET

  - name: Auth__GoogleClientSecret
    externalSecretKeyRef:
      key: GM-GOOGLE-CLIENT-SECRET

ingress:
  enabled: true
  rules:
    - host: api.greedymercs.com
      paths:
        - path: /
          pathType: Prefix
    - host: auth.greedymercs.com
      paths:
        - path: /
          pathType: Prefix
