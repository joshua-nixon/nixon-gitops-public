nameOverride: greedymercs-website

image: "containerregistry.azurecr.io/greedymercs.website:sha-a002309b6202"

securityContextPreset: "unset"

resources:
  limits:
    memory: 50Mi
    cpu: 50m

containerPorts:
  http:
    enabled: true

service:
  enabled: true
  ports:
    http:
      enabled: true

ingress:
  enabled: true
  rules:
    - host: www.greedymercs.com
      paths:
        - path: /
          pathType: Prefix
